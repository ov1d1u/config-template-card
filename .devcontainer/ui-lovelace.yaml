views:
  - cards:
      - type: picture-elements
        image: http://hs.sbcounty.gov/CN/Photo%20Gallery/_t/Sample%20Picture%20-%20Koala_jpg.jpg?Mobile=0
        elements:
          - type: custom:nunjucks-template-card
            style:
              top: 80.3%
              left: 77.6%
              opacity: 10%
            entities:
              - switch.ceiling_fan
            element:
              type: image
              tap_action:
                action: toggle
              entity: switch.ceiling_fan
              image: /local/floorplan/famfanoff.png
              state_image:
                'on': /local/floorplan/famfanon.png
          - type: 'custom:nunjucks-template-card'
            variables:
              - "{{ states('light.bed_light') }}"
            entities:
              - light.bed_light
            element:
              type: icon
              icon: "{{ 'mdi:home' if vars[0] == 'on' else 'mdi:circle' }}"
            style:
              top: 47%
              left: 75%
      - type: entities
        entities:
          - type: 'custom:nunjucks-template-card'
            variables:
              - "{{ states('light.bed_light') }}"
            entities:
              - light.bed_light
            row:
              type: section
              label: "{{ 'Light On' if vars[0] == 'on' else 'Light Off' }}"
          - entity: light.bed_light
      - type: 'custom:nunjucks-template-card'
        variables:
          - "{{ states('sensor.light') }}"
        entities:
          - '{{ vars[0] }}'
        card:
          type: light
          entity: '{{ vars[0] }}'
          name: "{{ 'Light On' if is_state(vars[0], 'on') else 'Light Off' }}"
      - type: 'custom:nunjucks-template-card'
        variables:
          - "{{ states('light.bed_light') }}"
          - "{{ states('cover.garage_door') }}"
        entities:
          - light.bed_light
          - cover.garage_door
          - alarm_control_panel.alarm
          - climate.ecobee
        card:
          type: "{{ 'custom:hui-glance-card' if vars[0] == 'on' else 'custom:hui-entities-card' }}"
          entities:
            - entity: alarm_control_panel.alarm
              name: "{{ 'Close the garage!' if vars[1] == 'open' and is_state('alarm_control_panel.alarm', 'armed_home') else '' }}"
            - entity: binary_sensor.basement_floor_wet
            - entity: climate.ecobee
              name: "{{ 'Cozy' if state_attr('climate.ecobee', 'current_temperature') | float > 22 else 'Too Hot/Cold' }}"
            - entity: cover.garage_door
            - entity: "{{ 'light.bed_light' if vars[0] == 'on' else 'climate.ecobee' }}"
              icon: "{{ 'mdi:hotel' if vars[1] == 'open' else '' }}"
